apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# HYPERSHELL-38: ONE shared Keycloak per cluster, serving every hypershell env
# (int/stage/prod). Managed by the RHBK operator (Red Hat build of Keycloak,
# pre-installed on the hub in keycloak-system) rather than a raw dev Deployment:
#
#   - keycloak.yaml       Keycloak CR (HTTP behind an edge Route; custom theme
#                         mounted via unsupported.podTemplate).
#   - keycloak-db.yaml    dedicated CloudNativePG Cluster for Keycloak's DB.
#   - realm-import.yaml   KeycloakRealmImport: the hypershell realm/clients
#                         (gitops source of truth, not upstream).
#   - route.yaml          external https entrypoint.
#
# The custom "hypershell" login theme ConfigMaps come straight from upstream as
# a pinned remote ref (deploy/base/keycloak/theme emits ONLY those two
# ConfigMaps -- no namespace, no Deployment), so we don't vendor a copy that can
# drift. keycloak.yaml mounts them by name into the operator-managed pod.
#
# The api-server in every env validates JWTs against this instance's internal
# JWKS (http://hypershell-keycloak-service.keycloak-system.svc:8080), avoiding a
# Route/TLS startup dependency. Deployed by its own ArgoCD Application at a lower
# sync-wave than the app envs (the api-server JWKS fetch is eager and fatal).
namespace: keycloak-system

resources:
  - keycloak-db.yaml
  - keycloak.yaml
  - realm-import.yaml
  - route.yaml
  # Custom login theme, pinned to the upstream commit that split it into a
  # standalone base (openshift-online/hypershell#121).
  - github.com/openshift-online/hypershell/deploy/base/keycloak/theme?ref=fc699366d71aebcaa314dc3f7c4d029079ab28f1
