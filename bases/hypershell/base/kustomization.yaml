apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# HYPERSHELL-38: this base is a thin passthrough to the hypershell repo, which
# is the single source of truth. It remote-refs deploy/hub (app-only: api-server,
# controller, web-console) pinned to a SHA. Env overlays patch only the
# per-instance bits (namespace, namePrefix, images, domain, DB, SSO).
#
# Deployed separately (NOT here):
#   - Keycloak: one shared instance per cluster (bases/hypershell/keycloak,
#     managed by the RHBK operator).
#   - Platform DB: a CloudNativePG Cluster authored in each env overlay.
#
# Auth is fully wired by deploy/hub (via deploy/openshift, PR #117): the
# api-server gets --enable-jwt/--enable-authz/--jwk-cert-url + auth-bypass flags
# and the controller gets OIDC_ISSUER/CLIENT_ID/CLIENT_SECRET, all sourced from
# a `hypershell-api-config` Secret that each env overlay supplies. There is no
# api-server command override here anymore.
#
# Pinned to hypershell main including PR #117 (auth contract) and PR #124
# (controller `bind` on the privileged SCC, so it can grant sandboxes the SCC
# at gateway-provision time).
resources:
  - github.com/openshift-online/hypershell/deploy/hub?ref=8eafa6af7a9d615fc65911f481663fc177399e98
