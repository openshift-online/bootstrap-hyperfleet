apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# INT overlay for hypershell. The base is a passthrough to the upstream
# deploy/hub (source of truth); this overlay patches only the int-specific bits:
# namespace, name prefix, controller wiring, the platform DB (CloudNativePG),
# and image tags. Auth is enabled in the base (shared across envs).
namespace: hypershell-int

resources:
  - ../../base
  - cnpg.yaml
  - sso.yaml
  - web-console-oidc.yaml

namePrefix: int-

patches:
  # Rename the upstream Namespace object (hypershell-system) to this env's ns.
  # deploy/hub ships the Namespace with no annotations, so add the block.
  - target:
      kind: Namespace
      name: hypershell-system
    patch: |
      - op: replace
        path: /metadata/name
        value: hypershell-int
      - op: add
        path: /metadata/annotations
        value:
          openshift.io/display-name: "HyperShell Integration"

  # The sandbox privileged-SCC binding targets a ServiceAccount the controller
  # creates at runtime (not a manifest resource), so the namespace transformer
  # leaves its subject at hypershell-system — retarget it to this env's ns.
  - target:
      kind: ClusterRoleBinding
      name: hypershell-sandbox-scc
    patch: |
      - op: replace
        path: /subjects/0/namespace
        value: hypershell-int

  # Turn on OIDC login in the web-console BFF. Setting OIDC_ISSUER activates
  # auth; CLIENT_ID + SESSION_SECRET are then required. The browser client is
  # public (PKCE), so no client secret. REDIRECT_URI host must match the console
  # Route and the realm frontend client's redirectUris. SESSION_SECRET comes
  # from the Secret in web-console-oidc.yaml (namePrefix rewrites the ref).
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: hypershell-web-console
        namespace: hypershell-system
      spec:
        template:
          spec:
            containers:
              - name: web-console
                env:
                  # deploy/hub hardcodes the api origin to the upstream ns/name;
                  # retarget it to this env's prefixed api-server service.
                  - name: HYPERSHELL_API_ORIGIN
                    value: "http://int-hypershell-api-server.hypershell-int.svc.cluster.local:8000"
                  - name: OIDC_ISSUER
                    value: "https://keycloak.hypershell-cluster-4c28435107377e996c6eb39230b7bcf5-0000.us-east.containers.appdomain.cloud/realms/hypershell"
                  - name: OIDC_CLIENT_ID
                    value: "hypershell-frontend"
                  - name: OIDC_REDIRECT_URI
                    value: "https://int-hypershell-console.hypershell-cluster-4c28435107377e996c6eb39230b7bcf5-0000.us-east.containers.appdomain.cloud/auth/callback"
                  - name: SESSION_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: hypershell-web-console-oidc
                        key: SESSION_SECRET

  # Point the controller at this env's api-server, namespace, and cluster domain.
  # Name-based (not index-based) so it survives upstream env reordering.
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: hypershell-controller
        namespace: hypershell-system
      spec:
        template:
          spec:
            containers:
              - name: controller
                env:
                  - name: HYPERSHELL_GRPC_SERVER_ADDR
                    value: "int-hypershell-api-server:9000"
                  - name: HYPERSHELL_API_SERVER_URL
                    value: "http://int-hypershell-api-server:8000"
                  - name: HYPERSHELL_NAMESPACE
                    value: "hypershell-int"
                  - name: GATEWAY_API_BASE_DOMAIN
                    value: "hypershell-cluster-4c28435107377e996c6eb39230b7bcf5-0000.us-east.containers.appdomain.cloud"

images:
  - name: quay.io/redhat-services-prod/hcm-eng-prod-tenant/hypershell-main/hypershell-api-server-main
    newTag: latest
  - name: quay.io/redhat-services-prod/hcm-eng-prod-tenant/hypershell-main/hypershell-control-plane-main
    newTag: latest
  - name: quay.io/redhat-services-prod/hcm-eng-prod-tenant/hypershell-main/hypershell-web-console-main
    newTag: latest
