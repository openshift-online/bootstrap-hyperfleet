apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# CloudNativePG is now installed from a pinned upstream release manifest in the
# base (see base/kustomization.yaml); the operator version is pinned by the
# vendored cnpg-<ver>.yaml filename rather than an OLM channel. This overlay is
# a passthrough kept for the existing app -> overlay path.
resources:
  - ../../base
