apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-sandbox-controller
  namespace: agent-sandbox-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-sandbox-controller
  template:
    metadata:
      labels:
        app: agent-sandbox-controller
    spec:
      serviceAccountName: agent-sandbox-controller
      securityContext:
        runAsNonRoot: true
      containers:
        - name: controller
          image: patch-me-see-overlays-dir
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
