apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-workload-monitoring
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  destination:
    name: in-cluster
  project: default
  source:
    path: clusters/global/operators/user-workload-monitoring
    repoURL: 'https://github.com/openshift-online/bootstrap'
    targetRevision: main
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
      allowEmpty: false
