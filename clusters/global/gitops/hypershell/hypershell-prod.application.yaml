apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hypershell-prod
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "12"
spec:
  destination:
    name: in-cluster
    namespace: hypershell-prod
  project: default
  source:
    path: bases/hypershell/overlays/prod
    repoURL: 'https://github.com/openshift-online/bootstrap'
    targetRevision: main
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
