apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hypershell-int
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  destination:
    name: in-cluster
    namespace: hypershell-int
  project: default
  source:
    path: bases/hypershell/overlays/int
    repoURL: 'https://github.com/openshift-online/bootstrap-hyperfleet'
    targetRevision: main
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
